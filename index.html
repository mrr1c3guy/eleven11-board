// ---------- STATE ----------
let assets=null,playIdx={},db=null,songs={},comments=[],todos=[],events=[],chat=[];

  const ax=AXES.map((_,i)=>{const v=all.map(p=>p[i]).filter(x=>typeof x==="number");return v.length?v.reduce((a,b)=>a+b,0)/v.length:null});

function radarSvg(s){const W=300,cx=150,cy=150,R=100,n=AXES.length;const ang=i=>-Math.PI/2+i*2*Math.PI/n;const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/3,cy+Math.sin(ang(i))*R*v/3];

function detail(s){const d=songs[s.id]||{};const vs=d.versions||[];const pv=vs[playIdx[s.id]??vs.length-1];const sp=d.splits||[];const tot=sp.reduce((a,x)=>a+(+x.pct||0),0);const cm=comments.filter(c=>c.song===s.id).sort((a,b)=>a.ts-b.ts);const A=kc(s.id);

  </div>
  <div class="col">
   <div><h4>Rating ${A&&A.score!=null?"· "+A.score.toFixed(1)+" / 11":""}</h4><div class="radar">${radarSvg(s)}<div class="note">Tap each axis: inner = not there yet, outer = nailed it. Average of everyone, scored out of 11.</div></div></div>
   <div><h4>Feedback</h4><div class="cms">${cm.length?cm.map(c=>`<div class="cm"><span class="meta">${esc(c.name)} · ${fmt(c.ts)}</span>${esc(c.text)}</div>`).join(""):`<div class="empty">No feedback yet.</div>`}</div>

function calHtml(){const y=calMonth.getFullYear(),m=calMonth.getMonth();const first=new Date(y,m,1);const off=(first.getDay()+6)%7;const start=new Date(y,m,1-off);const today=new Date().toDateString();
  const by={};events.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));

   c+=`<div class="d ${d.getMonth()!==m?"o":""} ${d.toDateString()===today?"today":""}" data-day="${k}"><span class="n">${d.getDate()}</span>${(by[k]||[]).map(e=>`<span class="ev ${e.kind==="Deadline"?"dl":""}" data-ev="${e.id}">${esc(e.text)}</span>`).join("")}</div>`}

function render(){

  <div><h1><span class="brand">ELEVEN<em>11</em></span><small>status board</small></h1></div>

   <div class="add"><select id="tw">${[...PEOPLE,"All"].map(p=>`<option ${p===me?"selected":""}>${p}</option>`).join("")}</select><input type="text" id="tt" placeholder="What needs to happen?"><button class="pill on" id="tb">+</button></div></section>
  <footer><span class="meta">ELEVEN11 · Tracksetters</span><button class="pill" id="logout">Log out</button></footer>`;
  bind();document.getElementById("fab").hidden=!db;

function notifs(){const meL=me.toLowerCase();const o=[];
  comments.forEach(c=>{if((c.name||"").toLowerCase()!==meL)o.push({ts:c.ts,text:`${c.name} on ${(SONGS.find(s=>s.id===c.song)||{}).title}: ${c.text}`.slice(0,120)})});
  todos.forEach(t=>{if((t.by||"").toLowerCase()!==meL&&!t.done)o.push({ts:t.ts,text:`${t.by} added a task: ${t.text}`})});
  Object.entries(demoPicks).forEach(([id,v])=>{if(v&&v.pick&&(v.by||"").toLowerCase()!==meL){const d=DEMOS.find(x=>x.id===id);if(d)o.push({ts:v.ts||0,text:`${v.by} shortlisted the demo ${d.title}`})}});
  SONGS.forEach(s=>{const d=songs[s.id];if(d&&d.ts&&d.by&&d.by.toLowerCase()!==meL&&d.status)o.push({ts:d.ts,text:`${d.by} set ${s.title} to ${d.status}`})});

const FB_CONFIG=window.FB_CONFIG;const TEAM_EMAIL="team@eleven11-board.app";
