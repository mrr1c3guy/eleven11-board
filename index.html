["play","pause","timeupdate","loadedmetadata","ended"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.tagName==="AUDIO"){if(ev==="play"){lastAudio=e.target;document.querySelectorAll("audio").forEach(x=>{if(x!==e.target)x.pause()})}miniUpdate()}},true));
addEventListener("scroll",miniUpdate,{passive:true});addEventListener("resize",miniUpdate);
document.getElementById("mpp").onclick=()=>{const a=curAudio();if(!a)return;a.paused?a.play():a.pause()};
document.getElementById("mbk").onclick=()=>{const a=curAudio();if(a)a.currentTime=Math.max(0,a.currentTime-5)};
document.getElementById("mseek").oninput=e=>{const a=curAudio();if(a&&a.duration)a.currentTime=e.target.value/1000*a.duration};
document.addEventListener("keydown",e=>{if(e.code!=="Space"||e.metaKey||e.ctrlKey)return;const t=e.target;if(t.closest&&t.closest("input,textarea,select,button,[contenteditable]"))return;const a=curAudio();if(!a)return;e.preventDefault();a.paused?a.play():a.pause()});
// ---------- CHAT ----------
function renderChat(){const box=document.getElementById("chms");if(!box)return;
  box.innerHTML=chat.length?chat.map(m=>`<div class="msg ${m.name===me?"me":""}"><span class="meta">${m.name===me?"":esc(m.name)+" · "}${fmt(m.ts)} ${new Date(m.ts).toTimeString().slice(0,5)}</span>${esc(m.text)}</div>`).join(""):`<div class="empty">No messages yet.</div>`;
  box.scrollTop=box.scrollHeight;
  const unread=chat.filter(m=>m.name!==me&&m.ts>chatSeen()).length;const b=document.getElementById("fbadge");b.hidden=!unread||chatOpen;b.textContent=unread>9?"9+":unread}
const chatSeen=()=>{try{return +localStorage.getItem("e11.chat."+me)||0}catch{return 0}};
document.getElementById("fab").onclick=()=>{chatOpen=!chatOpen;document.getElementById("chat").hidden=!chatOpen;if(chatOpen){try{localStorage.setItem("e11.chat."+me,String(Date.now()))}catch{}}renderChat();if(chatOpen)document.getElementById("chin").focus()};
document.getElementById("chx").onclick=()=>{chatOpen=false;document.getElementById("chat").hidden=true;renderChat()};
document.getElementById("chf").onsubmit=async e=>{e.preventDefault();if(needName())return;const i=document.getElementById("chin"),t=i.value.trim();if(!t||!db)return;i.value="";try{await db.collection("chat").add({text:t,name:me,ts:Date.now()})}catch{i.value=t;toast("Could not send")}};
// ---------- BOOT ----------
render();
// ---------- FIREBASE ----------
const FB_CONFIG=window.FB_CONFIG;const TEAM_EMAIL="team@eleven11-board.app";
firebase.initializeApp(FB_CONFIG);const auth=firebase.auth();
function startData(){
  db=firebase.firestore();
  const snap=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>Object.assign({id:d.id},d.data())));render()},()=>{});
  db.collection("songs").onSnapshot(s=>{songs={};s.docs.forEach(d=>songs[d.id]=d.data());render()},()=>{});
  snap("comments",a=>comments=a);db.collection("demopicks").onSnapshot(s=>{demoPicks={};s.docs.forEach(d=>demoPicks[d.id]=d.data());render()},()=>{});snap("todos",a=>todos=a);
  db.collection("chat").orderBy("ts","asc").limit(300).onSnapshot(s=>{chat=s.docs.map(d=>Object.assign({id:d.id},d.data()));renderChat()},()=>{});
  render();
}
const gate=document.getElementById("gate");
let gPick="";
function gateNames(){const g=document.getElementById("gn");g.innerHTML=PEOPLE.map(p=>`<button type="button" class="pill" data-gn="${p}" aria-pressed="${gPick===p}">${p}</button>`).join("");g.querySelectorAll("[data-gn]").forEach(b=>b.onclick=()=>{gPick=b.dataset.gn;gateNames();document.getElementById("gm").textContent="";const pw=document.getElementById("gp");if(!pw.hidden)pw.focus()})}
function setMe(n){me=n;try{localStorage.setItem("e11.name",me)}catch{}}
function showApp(){gate.hidden=true;document.getElementById("app").hidden=false;if(!db)startData();else{render();renderChat()}}
function showGate(namesOnly){const pw=document.getElementById("gp"),b=document.querySelector("#gf button[type=submit]");pw.hidden=namesOnly;pw.required=false;b.textContent=namesOnly?"Continue":"Enter";gateNames();gate.hidden=false;document.getElementById("app").hidden=true;document.getElementById("fab").hidden=true}
auth.onAuthStateChanged(u=>{if(u){if(me)showApp();else showGate(true)}else showGate(false)});
document.getElementById("gf").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("gp").value;const m=document.getElementById("gm");m.textContent="";
  if(!gPick){m.textContent="Tap your name first.";return}
  if(auth.currentUser){setMe(gPick);showApp();return}
  if(!pw){m.textContent="Enter the team password.";return}
  const b=e.target.querySelector("button[type=submit]");b.disabled=true;b.textContent="Checking…";
  try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});setMe(gPick);await auth.signInWithEmailAndPassword(TEAM_EMAIL,pw)}
  catch(err){me="";try{localStorage.removeItem("e11.name")}catch{};const c=err&&err.code||"";m.textContent=c==="auth/too-many-requests"?"Too many tries. Wait a few minutes, then try again.":c==="auth/network-request-failed"?"No connection to the server. Check your internet and try again.":/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?"Wrong password. Check caps lock and capital letters.":"Login failed ("+c+"). Send this to Tino."}
  finally{b.disabled=false;b.textContent=auth.currentUser?"Continue":"Enter"}};
document.addEventListener("click",e=>{if(e.target&&e.target.id==="logout"){try{localStorage.removeItem("e11.name")}catch{};auth.signOut().then(()=>location.reload())}});
</script>
